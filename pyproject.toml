[project]
name = "semantic-search-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "chromadb>=1.5.9",
    "datasets>=5.0.1",
    "fastapi>=0.141.1",
    "pytrec-eval>=0.5",
    "sentence-transformers>=5.7.0",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
